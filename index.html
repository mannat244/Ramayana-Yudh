<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Ramayana Yudh — 3D Mythological Action Game</title>
    <meta name="description" content="A browser-based 3D mythological action game inspired by the Ramayana, built with Three.js and Vite." />
    
    <!-- PWA Manifest & App Identity -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <meta name="theme-color" content="#0a0c18" />
    <meta name="color-scheme" content="dark" />

    <!-- Chrome, Edge & Android PWA Directives -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Ramayana Yudh" />

    <!-- iOS Safari PWA Directives -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ramayana Yudh" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="./icons/icon-512.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
